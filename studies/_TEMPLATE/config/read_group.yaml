  #         op: is_null
  # ADD MORE FILTERS HERE

# These create the default mapping logic for each field in a mapped record
mappings:
  # CUSTOMIZE: Add entries for each field in the mapped record
  # Template:
  # - target_field: your_target_field
  #   target_type: value/age/identifier/...
  #   source_field: null  # CUSTOMIZE
  #   source_label: null  # CUSTOMIZE
  #   params: {}  # CUSTOMIZE if needed
  #   value_mappings: {}  # CUSTOMIZE if needed
  #   default_value: null  # CUSTOMIZE if needed

  # --- Required fields ---
  - target_field: submitter_read_group_id
    target_type: identifier
    source_field: null  # CUSTOMIZE
    source_label: null  # CUSTOMIZE

  - target_field: submitter_experiment_id
    target_type: identifier
    source_field: null  # CUSTOMIZE
    source_label: null  # CUSTOMIZE

  - target_field: file_r1
    target_type: value
    source_field: null  # CUSTOMIZE
    source_label: null  # CUSTOMIZE

  - target_field: library_name
    target_type: value
    source_field: null  # CUSTOMIZE
    source_label: null  # CUSTOMIZE

  - target_field: library_layout
    target_type: value
    source_field: null  # CUSTOMIZE
    source_label: null  # CUSTOMIZE
    value_mappings: {}  # CUSTOMIZE: e.g. 1: "PAIRED", 2: "SINGLE"

  - target_field: platform_unit
    target_type: value
    source_field: null  # CUSTOMIZE
    source_label: null  # CUSTOMIZE

  # --- Conditional required field ---
  - target_field: file_r2
    target_type: value
    source_field: null  # CUSTOMIZE: only populated for paired-end libraries
    source_label: null  # CUSTOMIZE
    default_value: null

  # --- Optional fields ---
  - target_field: library_description
    target_type: value
    source_field: null  # CUSTOMIZE
    source_label: null  # CUSTOMIZE
    default_value: null

  - target_field: read_group_id_in_bam
    target_type: value
    source_field: null  # CUSTOMIZE: leave null for FASTQ submissions
    source_label: null  # CUSTOMIZE
    default_value: null

  - target_field: read_length_r1
    target_type: value
    source_field: null  # CUSTOMIZE
    source_label: null  # CUSTOMIZE
    default_value: null

  - target_field: read_length_r2
    target_type: value
    source_field: null  # CUSTOMIZE: only relevant for paired-end libraries
    source_label: null  # CUSTOMIZE
    default_value: null

  - target_field: insert_size
    target_type: value
    source_field: null  # CUSTOMIZE: only relevant for paired-end libraries
    source_label: null  # CUSTOMIZE
    default_value: null

