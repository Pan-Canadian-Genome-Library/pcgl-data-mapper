# Read Group Entity Configuration Template
#
# PCGL Base Schema: Read Group
# Describes a set of reads from a single sequencing run and instrument lane.
# All base fields are pre-defined below - customize source_field and source_label for your study

entity:
  name: ReadGroup

  # Optional: Multi-file input support
  # Uncomment and customize to load from specific CSV file(s)
  # source_files:
  #   primary: "read_groups.csv"
  #   # Optional: Join additional files if needed
  #   # secondary:
  #   #   - file: "experiments.csv"
  #   #     join_on: submitter_experiment_id
  #   #     columns: [platform, platform_model]

  fields:
    base:
      # Required fields
      - submitter_read_group_id     # Required: unique within each payload
      - submitter_experiment_id     # Required: unique experiment identifier within the study
      - file_r1                     # Required: sequencing file for the first end of a run
      - file_r2                     # Conditional required: sequencing file for the second end (paired-end only)
      - library_name                # Required: name of the sequencing library
      - library_layout              # Required: paired-end or single-end
      - platform_unit               # Required: unique identifier for each read group (e.g. {FLOWCELL}.{LANE}.{SAMPLE_BARCODE})
      # Optional fields
      - library_description         # Optional: description of the nucleotide sequencing library
      - read_group_id_in_bam        # Optional: @RG ID in the BAM header (not applicable to FASTQ files)
      - read_length_r1              # Optional: length of reads in file_r1 (number of sequencing cycles)
      - read_length_r2              # Optional: length of reads in file_r2 (number of sequencing cycles)
      - insert_size                 # Optional: average insert size for paired-end sequencing
    # optionally include extension fields
    # extension:
      # Template: Add any extension fields needed for your study
      # - read_group_note
      # ADD MORE EXTENSION FIELDS HERE

  pattern: direct

