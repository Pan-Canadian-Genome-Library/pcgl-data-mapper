# Sociodemographic Entity Configuration Template
#
# PCGL Base Schema: Sociodemographic
# All base fields are pre-defined below - customize source_field and source_label for your study

entity:
  name: Sociodemographic
  source_files:
    primary: "Donor.csv"
  
  fields:
    base:
      - submitter_sociodem_id
      - submitter_participant_id
      - age_at_sociodem_collection
      - sociodem_date_collection
      - race
      - race_another_racial_category
      - race_collect_method
      - gender
      - gender_another_gender
      - gender_collect_method
      - ethnicity
      - ethnicity_another_category
      - ethnicity_collect_method
      - sex_at_birth
      - sex_another_category
      - sex_collect_method
      - education
      - education_collect_method
      - personal_income
      - personal_income_collect_method
      - geographic_location
      - geographic_location_additional
      - geographic_location_collect_method
      - sociodem_question
      - sociodem_question_detail
      - sociodem_notes
    # optionally include extension fields
    # extension:
      # Template: Add any extension fields needed for your study
      # - ... add extension fields here ...

  pattern: direct
  
# Optional preprocessing steps before mapping
preprocessing:
  # Template: 
  # - type: clean_numeric/strip_whitespace/...
  #   fields: []  # CUSTOMIZE
  # ADD MORE PREPROCESSING STEPS HERE

# Optional filters to apply before mapping
filters: 
  # Template:
  # participant_id_field: participant_id  # CUSTOMIZE
  # eligible_participants: true
  # include_rows:
  #   baseline: true
  #   repeat_instruments: []
  # field_filters:
  #   - field: source_field_name
  #     operator: equals/not_equals/greater_than/...
  #     value: some_value
  # ADD MORE FILTERS HERE

# These create the default mapping logic for each field in a mapped record
mappings:
  # CUSTOMIZE: Add entries for each field in the mapped record 
  # Template:
  # - target_field: your_target_field
  #   target_type: value/age/identifier/...
  #   source_field: null  # CUSTOMIZE
  #   source_label: null  # CUSTOMIZE
  #   params: {}  # CUSTOMIZE if needed
  #   value_mappings: {}  # CUSTOMIZE if needed
  #   default_value: null  # CUSTOMIZE if needed
  # ADD MORE FIELD MAPPING HERE
  - source_field: submitter_donor_id
    target_field: submitter_sociodem_id
    source_label: null
    target_type: identifier
    params:
      prefix_field: submitter_donor_id
      type: sociodem
      suffix_fields: null

  # ---------------------------------------------------------------------------
  # Participant Identifier
  # ---------------------------------------------------------------------------
  - source_field: participant_id
    target_field: submitter_donor_id

  # ---------------------------------------------------------------------------
  # Ethnicity
  # Source: ethnicity field with value mappings
  # ---------------------------------------------------------------------------
  - source_field: null
    target_field: ethnicity
    default_value: "Missing - Not collected"

  # ---------------------------------------------------------------------------
  # Sex at Birth
  # ---------------------------------------------------------------------------
  - source_field: sex_at_birth
    target_field: sex_at_birth
    value_mappings:
      "Male": "Male"
      "Female": "Female"
      "Other": "Another Sex"
    default_value: "Missing - Unknown"

  - source_field: sex_at_birth
    target_field: sex_collect_method
    source_label: null
    value_mappings:
      "Male": "Self-identified"
      "Female": "Self-identified"
      "Other": "Self-identified"
    default_value: "Missing - Not provided"

  # ---------------------------------------------------------------------------
  # Age at Collection
  # ---------------------------------------------------------------------------
  - source_field: null
    target_field: age_at_sociodem_collection
    default_value: 0

  # ---------------------------------------------------------------------------
  # Collection Date
  # ---------------------------------------------------------------------------
  - source_field: enrollment_date
    target_field: sociodem_date_collection
    default_value: 1800-01-01

  # ---------------------------------------------------------------------------
  # Race
  # ---------------------------------------------------------------------------
  - source_field: null
    target_field: race
    default_value: "Missing - Not collected"

  - source_field: null
    target_field: race_another_racial_category
    source_label: null
    default_value: null

  - source_field: null
    target_field: race_collect_method
    source_label: null
    default_value: "Missing - Not collected"

  # ---------------------------------------------------------------------------
  # Gender
  # ---------------------------------------------------------------------------
  - source_field: gender
    target_field: gender
    value_mappings:
      "Man": "Man"
      "Woman": "Woman"
      "Non-binary": "Another Gender"
      "Other": "Another Gender"
      "Prefer not to disclose": "Prefer not to answer"
    default_value: "Missing - Not collected"

  - source_field: null
    target_field: gender_collect_method
    source_label: null
    default_value: "Missing - Unknown"

  # ---------------------------------------------------------------------------
  # Ethnicity
  # ---------------------------------------------------------------------------
  - source_field: null
    target_field: ethnicity
    source_label: null
    default_value: "Missing - Not collected"

  - source_field: null
    target_field: ethnicity_another_category
    source_label: null
    default_value: null

  - source_field: null
    target_field: ethnicity_collect_method
    source_label: null
    default_value: "Missing - Not collected"

  # ---------------------------------------------------------------------------
  # Education
  # ---------------------------------------------------------------------------
  - source_field: null
    target_field: education
    default_value: "Missing - Not collected"

  - source_field: null
    target_field: education_collect_method
    source_label: null
    default_value: "Missing - Not collected"

  # ---------------------------------------------------------------------------
  # Personal Income
  # ---------------------------------------------------------------------------
  - source_field: null
    target_field: personal_income
    source_label: null
    default_value: "Missing - Not collected"

  - source_field: null
    target_field: personal_income_collect_method
    source_label: null
    default_value: "Missing - Not collected"

  # ---------------------------------------------------------------------------
  # Geographic Location
  # ---------------------------------------------------------------------------
  - source_field: null
    target_field: geographic_location
    source_label: null
    default_value: "Missing - Not collected"

  - source_field: null
    target_field: geographic_location_additional
    source_label: null
    default_value: null

  - source_field: null
    target_field: geographic_location_collect_method
    source_label: null
    default_value: "Missing - Not collected"

  # ---------------------------------------------------------------------------
  # Sociodem Question and Detail
  # ---------------------------------------------------------------------------
  - source_field: null
    target_field: sociodem_question
    source_label: null
    default_value: "Missing - Not collected"

  # ---------------------------------------------------------------------------
  # Sociodem Notes
  # ---------------------------------------------------------------------------
  - source_field: null
    target_field: sociodem_notes
    source_label: null

