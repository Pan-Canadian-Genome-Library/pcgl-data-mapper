# Example Study - Specimen Entity Mapping Configuration
#
# Target Entity: Specimen (PCGL Base Schema)
# Source: Example CSV export
# Pattern: Direct mapping

entity:
  name: Specimen
  source_files:
    primary: "Specimen.csv"
    secondary:
      - file: "SampleRegistration.csv"
        join_on: submitter_specimen_id
        columns: [specimen_tissue_source]
  fields:
    base:
      - submitter_participant_id
      - submitter_specimen_id
      - specimen_tissue_source_code
  pattern: direct

mappings:
  # ---------------------------------------------------------------------------
  # Participant Identifier
  # Source: participant_id
  # ---------------------------------------------------------------------------
  - source_field: submitter_donor_id
    target_field: submitter_participant_id
  
  # ---------------------------------------------------------------------------
  # Specimen Identifier
  # Format: {participant_id}_specimen_{sample_id}
  # ---------------------------------------------------------------------------
  - source_field: submitter_specimen_id
    target_field: submitter_specimen_id
    source_label: null
  
  # ---------------------------------------------------------------------------
  # Tissue Source Term
  # Source: specimen_type (free text)
  # ---------------------------------------------------------------------------
  - source_field: specimen_tissue_source
    target_field: specimen_tissue_source_code
    default_value: "NCIT:C17998"
    value_mappings:
      "Abdominal fluid": "NCIT:C77611"
      "Amniotic fluid": "NCIT:C13188"
      "Arterial blood": "NCIT:C78729"
      "Bile": "NCIT:C13192"
      "Blood derived - bone marrow": "NCIT:C12431"
      "Blood derived - peripheral blood": "NCIT:C173496"
      "Bone marrow fluid": "NCIT:C12431"
      "Bone marrow derived mononuclear cells": "NCIT:C164011"
      "Buccal cell": "NCIT:C172264"
